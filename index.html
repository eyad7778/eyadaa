    window.medadLoadCourseContent=async(client,course,isOwner=false)=>{
      if(course.contentLoading||course.sections)return;
      course.contentLoading=true;
      const {data:sections,error}=await client.from('course_sections').select('id,title,description,sort_order,lectures(id,title,description,summary,duration_seconds,completion_required_percent,is_published,sort_order,video_sources(video_id,playback_speed_enabled),lecture_resources(id,title,resource_type,storage_path,external_url,downloadable,available_after_completion),watch_progress(student_id,current_time_seconds,watched_duration_seconds,progress_percentage,completed,last_watched_at))').eq('course_id',course.id).order('sort_order');
      course.contentLoading=false;
      if(error){console.error('Could not load course content',error.message);return}
      course.sections=sections||[];
      for(const section of course.sections){
        for(const lecture of section.lectures||[]){
          for(const resource of lecture.lecture_resources||[]){
            if(!resource.storage_path)continue;
            const {data}=await client.storage.from('course-resources').createSignedUrl(resource.storage_path,120);
            resource.url=data?.signedUrl||'';
          }
        }
      }
      if(!isOwner&&!course.isFree&&!course.sections.some(section=>section.lectures?.length)){
        const {data:subscription}=await client.from('subscriptions').select('id').eq('course_id',course.id).eq('student_id',window.medad?.user?.id).eq('status','active').maybeSingle();
        course.accessDenied=!subscription;
      }
      course.lessons=course.sections.reduce((count,section)=>count+(section.lectures||[]).length,0);
      if(view==='lesson'&&String(activeCourse)===String(course.id))renderLesson(course.id);
    };

    window.medadLoadStudentDashboard=async(client,user)=>{
      const {data:subscriptions,error:subscriptionError}=await client.from('subscriptions').select('course_id,starts_at,expires_at').eq('student_id',user.id).eq('status','active');
      if(subscriptionError){console.error('Could not load student subscriptions',subscriptionError.message);return}
      const now=Date.now();
      enrolled=(subscriptions||[]).filter(item=>(!item.starts_at||Date.parse(item.starts_at)<=now)&&(!item.expires_at||Date.parse(item.expires_at)>now)).map(item=>item.course_id);
      localStorage.setItem('medad-enrolled',JSON.stringify(enrolled));
      const {data:progress,error:progressError}=await client.from('watch_progress').select('lecture_id,current_time_seconds,watched_duration_seconds,progress_percentage,completed,last_watched_at').eq('student_id',user.id);
      if(progressError){console.error('Could not load student progress',progressError.message);return}
      let lectureCourses=[];
      if(progress?.length){
        const {data,error}=await client.from('lectures').select('id,course_sections!inner(course_id)').in('id',progress.map(item=>item.lecture_id));
        if(error){console.error('Could not map watched lectures to courses',error.message);return}
        lectureCourses=data||[];
      }
      const courseByLecture=new Map(lectureCourses.map(item=>[item.id,Array.isArray(item.course_sections)?item.course_sections[0]?.course_id:item.course_sections?.course_id]));
      savedProgress={};
      let watchedSeconds=0;
      let completedLessons=0;
      const progressByCourse=new Map();
      for(const item of progress||[]){
        const courseId=courseByLecture.get(item.lecture_id);
        if(!courseId)continue;
        watchedSeconds+=Number(item.watched_duration_seconds||0);
        completedLessons+=item.completed?1:0;
        if(!progressByCourse.has(courseId))progressByCourse.set(courseId,[]);
        progressByCourse.get(courseId).push(item);
        const previous=savedProgress[courseId];
        if(!previous||Date.parse(item.last_watched_at)>Date.parse(previous.lastWatched||''))savedProgress[courseId]={percent:Number(item.progress_percentage)||0,time:Number(item.current_time_seconds)||0,lastWatched:item.last_watched_at,lesson:'آخر محاضرة شاهدتها'};
      }
      for(const course of courses){
        const items=progressByCourse.get(course.id)||[];
        course.progress=items.length?Math.round(items.reduce((total,item)=>total+Number(item.progress_percentage||0),0)/items.length):0;
        if(enrolled.includes(course.id)&&!savedProgress[course.id])savedProgress[course.id]={percent:0,lesson:'لم تبدأ التعلم بعد'};
      }
      localStorage.setItem('medad-progress',JSON.stringify(savedProgress));
      window.medadStudentStats={completedLessons,learningHours:Math.round(watchedSeconds/3600*10)/10};
      if(view==='dashboard')render();
    };

/div><div class="panel"><h2>آخر الاشتراكات</h2><div class="notice"><i class="notice-mark"></i><div>سارة محمود اشتركت في كورس التاريخ.<small>منذ ٤٠ دقيقة</small></div></div><div class="notice"><i class="notice-mark" style="background:var(--yellow)"></i><div>يوسف أحمد اشترك في كورس الأحياء.<small>منذ ٣ ساعات</small></div></div></div></div></section>`}

    function renderLesson(id){let c=courses.find(x=>String(x.id)===String(id))||courses[0],p=savedProgress[c.id]?.percent??courseProgress(c);app.innerHTML=`<section class="fade-in"><button class="text-btn" data-view="dashboard">← العودة إلى لوحتي</button><div class="lesson-layout"><div><div class="player-wrap"><div class="video-frame" id="videoFrame"><video id="lessonVideo" playsinline poster="${c.img}" preload="metadata"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4"></video><span class="watermark" id="watermark">أحمد محمد · ID: 10254</span><div class="video-overlay"><button class="big-play" id="bigPlay" aria-label="تشغيل">▶</button></div><div class="controls"><input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="تقدم الفيديو"><div class="control-row"><button class="ctrl" id="back10" title="رجوع ١٠ ثوانٍ">↶ ١٠</button><button class="ctrl" id="playPause" title="تشغيل أو إيقاف">▶</button><button class="ctrl" id="forward10" title="تقديم ١٠ ثوانٍ">١٠ ↷</button><span class="time" id="currentTime">00:00</span><span class="time">/</span><span class="time" id="duration">00:00</span><span class="control-spacer"></span><select class="ctrl" id="speed" title="سرعة التشغيل" style="background:#0005;border:0;color:white;border-radius:4px"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button class="ctrl" id="mute" title="الصوت">◖))</button><button class="ctrl" id="fullscreen" title="ملء الشاشة">⛶</button></div></div></div><div class="player-info"><h1>${c.title} · الوحدة الأولى</h1><p>الدرس الأول　·　${c.teacher}　·　تقدمك في الكورس ${p}%</p></div></div><aside class="panel"><h2>محتوى الكورس <span style="color:var(--muted);font-size:10px;font-weight:400">${c.lessons} درسًا</span></h2><div class="lesson-list"><div class="unit-title">الوحدة الأولى · مدخل إلى المادة</div>${['مقدمة الوحدة','الحضارة المصرية القديمة','م     renderLesson=function(id){
      const course=courses.find(item=>String(item.id)===String(id))||courses[0];
      activeCourse=course.id;
      const sections=course.sections||[];
      const lectures=sections.flatMap(section=>(section.lectures||[]).map(lecture=>({...lecture,sectionTitle:section.title})));
      let lecture=lectures.find(item=>String(item.id)===String(activeLectureId))||lectures[0]||null;
      activeLectureId=lecture?.id||null;
      const source=Array.isArray(lecture?.video_sources)?lecture.video_sources[0]:lecture?.video_sources;
      course.lectureId=lecture?.id||null;
      course.youtubeVideoId=source?.video_id||'';
      course.playbackSpeedEnabled=source?.playback_speed_enabled!==false;
      const studentProgress=lecture?.watch_progress?.find(item=>item.student_id===window.medad?.user?.id)||lecture?.watch_progress?.[0];
      const percent=Number(studentProgress?.progress_percentage||0);
      const sectionsHtml=sections.length?sections.map(section=>`<div class="unit-title">${section.title}</div>${(section.lectures||[]).map(item=>`<button class="lesson-item ${String(item.id)===String(lecture?.id)?'current':''}" data-lesson-id="${item.id}" type="button"><span class="lesson-play">${item.completed?'✓':'○'}</span><span>${item.title}</span><small>${fmt(item.duration_seconds||0)}</small></button>`).join('')}`).join(''):'<p style="font-size:10px;color:var(--muted)">'+(course.accessDenied?'اشترك في الكورس للوصول إلى الوحدات والمحاضرات.':course.contentLoading?'جارٍ تحميل محتوى الكورس...':'لم تُضف وحدات ومحاضرات لهذا الكورس بعد.')+'</p>';
      const resources=lecture?.lecture_resources||[];
      const resourcesHtml=resources.length?resources.map(resource=>{const locked=resource.available_after_completion&&!studentProgress?.completed&&window.medad?.profile?.role!=='owner';const url=resource.url||resource.external_url||'';return `<div class="resource"><span>${resource.resource_type==='pdf'?'↓':'▤'}</span><div><b>${resource.title}</b><small>${locked?'متاح بعد إكمال المحاضرة':resource.resource_type==='pdf'?'ملف PDF':'مورد تعليمي'}</small></div>${url&&!locked?`<a class="primary resource-action" href="${url}" target="_blank" rel="noopener">${resource.downloadable?'فتح':'عرض'}</a>`:'<span class="resource-locked">غير متاح</span>'}</div>`}).join(''):'<div class="resource"><div><b>ملخص وملفات المحاضرة</b><small>ستظهر هنا بعد إضافتها من لوحة المدرس.</small></div></div>';
      const identity=window.medad?.profile?.display_name||'الطالب';
      const identityId=window.medad?.user?.id?.slice(0,8)||'—';
      const lessonTitle=lecture?.title||'محتوى الكورس';
      app.innerHTML=`<section class="fade-in"><button class="text-btn" data-view="dashboard">← العودة إلى لوحة الطالب</button><div class="lesson-layout"><div><div class="player-wrap"><div class="video-frame" id="videoFrame"><video id="lessonVideo" playsinline poster="${course.img}" preload="none"></video><span class="watermark" id="watermark">${identity} · ID: ${identityId}</span><div class="video-overlay"><button class="big-play" id="bigPlay" aria-label="تشغيل">▶</button></div><div class="controls"><input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="تقدم الفيديو"><div class="control-row"><button class="ctrl" id="back10" title="رجوع ١٠ ثوانٍ">↶ ١٠</button><button class="ctrl" id="playPause" title="تشغيل أو إيقاف">▶</button><button class="ctrl" id="forward10" title="تقديم ١٠ ثوانٍ">١٠ ↷</button><span class="time" id="currentTime">00:00</span><span class="time">/</span><span class="time" id="duration">${fmt(lecture?.duration_seconds||0)}</span><span class="control-spacer"></span><select class="ctrl" id="speed" title="سرعة التشغيل" style="background:#0005;border:0;color:white;border-radius:4px"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button class="ctrl" id="mute" title="الصوت">◖))</button><button class="ctrl" id="fullscreen" title="ملء الشاشة">⛶</button></div></div></div><div class="player-info"><h1>${course.title} · ${lessonTitle}</h1><p>${lecture?.sectionTitle||'محتوى الكورس'}　·　${platformTeacher.name}　·　تقدم المحاضرة ${percent}%</p></div></div><aside class="panel"><h2>محتوى الكورس <span style="color:var(--muted);font-size:10px;font-weight:400">${lectures.length} درسًا</span></h2><div class="lesson-list">${sectionsHtml}</div><div class="progress-bar" style="margin-top:15px"><i style="width:${percent}%"></i></div><small style="color:var(--muted);font-size:9px">${studentProgress?.completed?'✓ مكتملة':`أكملت ${percent}% من المحاضرة`}</small></aside></div><div class="resource-row">${resourcesHtml}</div></section>`;
      document.querySelectorAll('[data-lesson-id]').forEach(button=>button.onclick=()=>{activeLectureId=button.dataset.lessonId;renderLesson(course.id)});
      setupVideo(course);
      if(!course.sections&&window.medad?.client)window.medadLoadCourseContent(window.medad.client,course,window.medad.profile?.role==='owner');
    };
    function setupVideo(c){let v=document.getElementById('lessonVideo'),play=document.getElementById('playPause'),big=document.getElementById('bigPlay'),seek=document.getElementById('seek');function toggle(){if(v.paused)v.play().catch(()=>toast('يتعذر تشغيل الفيديو التجريبي الآن'));else v.pause()}play.onclick=big.onclick=toggle;v.onplay=()=>{play.textContent='Ⅱ';big.classList.add('hidden')};v.onpause=()=>{play.textContent='▶';big.classList.remove('hidden')};v.ontimeupdate=()=>{if(!v.duration)return;seek.value=v.currentTime/v.duration*100;document.getElementById('currentTime').textContent=fmt(v.currentTime);document.getElementById('duration').textContent=fmt(v.duration);let percent=Math.max(courseProgress(c),Math.floor((v.currentTime/v.duration)*100));savedProgress[c.id]={percent,lesson:'الوحدة الأولى · الدرس الأول',time:v.currentTime};localStorage.setItem('medad-progress',JSON.stringify(savedProgress))};seek.oninput=()=>{if(v.duration)v.currentTime=seek.value/100*v.duration};document.getElementById('back10').onclick=()=>v.currentTime=Math.max(0,v.currentTime-10);document.getElementById('forward10').onclick=()=>v.currentTime=Math.min(v.duration||0,v.currentTime+10);document.getElementById('speed').onchange=e=>v.playbackRate=Number(e.target.value);document.getElementById('mute').onclick=e=>{v.muted=!v.muted;e.currentTarget.textContent=v.muted?'◖×':'◖))'};document.getElementById('fullscreen').onclick=()=>document.getElementById('videoFrame').requestFullscreen?.();let spots=['10%','75%','28%','55%'];let wm=document.getElementById('watermark'),i=0;setInterval(()=>{if(!document.hidden&&wm){i=(i+1)%spots.length;wm.style.right=spots[i];wm.style.top=spots[(i+1)%spots.length]}},12000);document.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>{document.querySelectorAll('[data-lesson]').forEach(x=>x.classList.remove('current'));el.classList.add('current');toast('تم فتح '+el.querySelector('span:nth-child(2)').textContent)})}
    function fmt(s){if(!Number.isFinite(s))return'00:00';return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`}
    function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='profile'&&b.dataset.view==='teachers')||(view==='lesson'&&b.dataset.view==='dashboard')));if(view==='home')renderHome();else if(view==='courses')renderCourses();else if(view==='teachers')renderTeachers();else if(view==='dashboard')renderDashboard();else if(view==='profile')renderTeacher(window.profileId);else if(view==='lesson')renderLesson(activeCourse);window.scrollTo({top:0,behavior:'smooth'})}
    function toast(text){let old=document.querySelector('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
    function notifyFirstVisit(){
      const key='medad-first-visit';
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key,'1');
      toast('أهلاً بك في منصة مستر إياد الطيب | المؤرخ الصغير 📜 — ستصلك إشعارات أول زيارة وتحديثات الواجبات والاختبارات فورًا.');
      if (window.medad?.client && window.medad?.user) {
        window.medad.client.from('notifications').insert({
          student_id: window.medad.user.id,
          title: 'أهلاً بك في المنصة',
          body: 'مرحبًا بك في منصة المؤرخ الصغير. تابع دروسك، واستقبل إشعارات الاختبارات والواجبات فورًا.',
          notification_type: 'welcome'
        }).then(({error}) => {
          if (error) console.warn('Welcome notification not stored:', error.message);
        }).catch(error => console.warn('Welcome notification failed:', error.message));
      }
    }
    window.notifyFirstVisit = notifyFirstVisit;

    function loadYouTubeAPI(){
      if(window.YT?.Player)return Promise.resolve();

      window.youtubeApiReady=new Promise(resolve=>{
        window.onYouTubeIframeAPIReady=resolve;
        const script=document.createElement('script');
        script.src='https://www.youtube.com/iframe_api';
        document.head.append(script);
      });

    }
    setupVideo=async function(course){
      const frame=document.getElementById('videoFrame');
      const oldVideo=document.getElementById('lessonVideo');
      const playerHost=document.createElement('div');
      playerHost.id='youtubePlayer';
      playerHost.style.cssText='position:relative;z-index:1;width:100%;height:100%';
      frame.style.backgroundImage=`linear-gradient(#15231c55,#15231c88),url("${course.img}")`;
      frame.style.backgroundSize='cover';
      frame.style.backgroundPosition='center';
      oldVideo?.replaceWith(playerHost);
      const playerButton=document.getElementById('playPause');
      const bigButton=document.getElementById('bigPlay');
      const seek=document.getElementById('seek');
      const muteButton=document.getElementById('mute');
      const speedControl=document.getElementById('speed');
      const volumeControl=document.createElement('input');
      volumeControl.className='volume-control';
      volumeControl.type='range';
      volumeControl.min='0';
      volumeControl.max='100';
      volumeControl.value='75';
      volumeControl.setAttribute('aria-label','مستوى الصوت');
      muteButton.before(volumeControl);
      const videoId=course.youtubeVideoId||course.videoId||'';
      if(!/^[A-Za-z0-9_-]{11}$/.test(videoId)){
        playerHost.insertAdjacentHTML('beforebegin','<div class="video-placeholder">لم يضف المدرس رابط فيديو هذه المحاضرة بعد.</div>');
        [playerButton,bigButton,seek,muteButton,volumeControl,speedControl].forEach(control=>control.disabled=true);
        return;
      }
      try{
        await loadYouTubeAPI();
      }catch{
        toast('تعذر تحميل YouTube IFrame Player API.');
        return;
      }
      let player=null;
      let lastSave=0;
      let lastTime=0;
      const saveProgress=async currentTime=>{
        const duration=player?.getDuration()||0;
        if(!duration)return;
        const localPercent=Math.floor(currentTime/duration*100);
        savedProgress[course.id]={percent:Math.max(courseProgress(course),localPercent),lesson:'الوحدة الأولى · الدرس الأول',time:currentTime};
        localStorage.setItem('medad-progress',JSON.stringify(savedProgress));
        if(!course.lectureId||!window.medad?.user||window.medad.profile?.role==='owner')return;
        const now=Date.now();
        if(now-lastSave<15000&&currentTime!==duration)return;
        lastSave=now;
        const {data,error}=await window.medad.client.rpc('record_watch_progress',{
          p_lecture_id:course.lectureId,
          p_current_time_seconds:Math.floor(currentTime)
        });
        if(!error&&data?.progress_percentage!==undefined){
          savedProgress[course.id].percent=Number(data.progress_percentage);
          localStorage.setItem('medad-progress',JSON.stringify(savedProgress));
        }
      };
      player=new YT.Player('youtubePlayer',{videoId,playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,playsinline:1,rel:0,origin:location.origin},events:{
        onReady:async event=>{
          const {data,error}=window.medad?.user&&course.lectureId?await window.medad.client.from('watch_progress').select('current_time_seconds').eq('student_id',window.medad.user.id).eq('lecture_id',course.lectureId).maybeSingle():{data:null,error:null};
          if(!error&&data?.current_time_seconds>0){event.target.seekTo(data.current_time_seconds,true);toast(`استكمال من ${fmt(data.current_time_seconds)}`)}
          event.target.setVolume(Number(volumeControl.value));
          const rates=event.target.getAvailablePlaybackRates();
          [...speedControl.options].forEach(option=>{option.hidden=!rates.includes(Number(option.value))});
          speedControl.disabled=course.playbackSpeedEnabled===false;
          if(course.playbackSpeedEnabled===false)speedControl.hidden=true;
          document.getElementById('duration').textContent=fmt(event.target.getDuration());
        },
        onStateChange:event=>{
          const playing=event.data===YT.PlayerState.PLAYING;
          playerButton.textContent=playing?'Ⅱ':'▶';
          bigButton.classList.toggle('hidden',playing);
          if(event.data===YT.PlayerState.ENDED)saveProgress(player.getDuration());
        },
        onError:()=>toast('تعذر تشغيل الفيديو. تحقق من أن إعدادات YouTube تسمح بالتضمين.')
      }});
      playerButton.onclick=bigButton.onclick=()=>{
        if(player.getPlayerState()===YT.PlayerState.PLAYING)player.pauseVideo();
        else player.playVideo();
      };
      document.getElementById('back10').onclick=()=>player.seekTo(Math.max(0,player.getCurrentTime()-10),true);
      document.getElementById('forward10').onclick=()=>player.seekTo(Math.min(player.getDuration(),player.getCurrentTime()+10),true);
      seek.oninput=()=>{const duration=player.getDuration();if(duration)player.seekTo(duration*Number(seek.value)/100,true)};
      muteButton.onclick=()=>{if(player.isMuted()){player.unMute();muteButton.textContent='◖))'}else{player.mute();muteButton.textContent='◖×'}};
      volumeControl.oninput=()=>{player.setVolume(Number(volumeControl.value));if(player.isMuted()&&Number(volumeControl.value)>0)player.unMute()};
      speedControl.onchange=()=>player.setPlaybackRate(Number(speedControl.value));
      document.getElementById('fullscreen').onclick=()=>frame.requestFullscreen?.();
      const progressTimer=setInterval(()=>{
        if(!player||typeof player.getCurrentTime!=='function'||!player.getDuration())return;
        const currentTime=player.getCurrentTime();
        const duration=player.getDuration();
        document.getElementById('currentTime').textContent=fmt(currentTime);
        document.getElementById('duration').textContent=fmt(duration);
        if(player.getPlayerState()===YT.PlayerState.PLAYING){seek.value=String(currentTime/duration*100);if(currentTime-lastTime>=1){lastTime=currentTime;saveProgress(currentTime)}}
      },1000);
      frame.addEventListener('DOMNodeRemoved',()=>clearInterval(progressTimer),{once:true});
      const positions=[['10%','16%'],['76%','24%'],['24%','68%'],['62%','42%']];
      const watermark=document.getElementById('watermark');
      let position=0;
      const watermarkTimer=setInterval(()=>{if(document.hidden||!watermark.isConnected)return;position=(position+1)%positions.length;watermark.style.right=positions[position][0];watermark.style.top=positions[position][1]},12000);
      frame.addEventListener('DOMNodeRemoved',()=>clearInterval(watermarkTimer),{once:true});
    };
    window.medadNavigate=(role)=>{
      roleSelect.value=role==='teacher'?'teacher':'student';
      view='dashboard';
      render();
    };
    render();
    notifyFirstVisit();
  </script>

      if(location.protocol!=='file:'){
        const authScript=document.createElement('script');
        authScript.type='module';
        authScript.src='./auth.js';
        document.body.append(authScript);
      }else{
        document.getElementById('loginBtn').onclick=()=>toast('المصادقة الحقيقية تتوفر بعد نشر المنصة وربط Supabase.');
      }
    </script>
